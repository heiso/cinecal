  scrap-posters:
    name: Scrap Posters
    needs: [scrap-showtimes]
    runs-on: self-hosted
    # runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      # - uses: superfly/flyctl-actions/setup-flyctl@master
      # - run: flyctl ssh console -a cinecal -C "node ./build/cli scrapPosters"
      #   env:
      #     FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - uses: actions/setup-node@v2
        with:
          node-version: '20.6.0'
          # cache: 'npm'
      - run: npm ci
      - run: npx prisma generate

      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: |
          flyctl proxy 5432:5432 -a cinecal-db &
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1 && echo "proxy up" && break
            echo "waiting for proxy..."; sleep 1
          done
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - run: npx tsx ./cli scrapPosters
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          IMAGEKIT_API_KEY: ${{ secrets.IMAGEKIT_API_KEY }}

  save-poster-blur-hashes:

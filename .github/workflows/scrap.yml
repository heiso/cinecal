name: Scrap showtimes

on:
  workflow_dispatch:
    inputs:
      days:
        default: 90
        type: number
        description: Days
        required: true
  schedule:
    # Runs every 30 minutes. Allocine (Cloudflare) enforces a per-IP rolling
    # request budget (~5min window), so a single 90-day run cannot fetch
    # everything. Instead, each run fetches what it can before hitting the
    # budget; the showtimes cache lasts until end-of-day, so the next run only
    # fetches the gaps (cached URLs are free) and the range converges over a few
    # runs. See the note in cli/scraper.ts.
    - cron: '*/30 * * * *'

# A run that outlasts the schedule makes the next one wait instead of overlapping
concurrency:
  group: scrap
  cancel-in-progress: false

jobs:
  scrap:
    name: Scrap showtimes and posters
    runs-on: self-hosted
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --omit=dev

      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      # The proxy keeps running for the next steps and stops with the job
      - name: Open a tunnel to the database
        run: |
          flyctl proxy 5432:5432 -a cinecal-db &
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1 && echo "proxy up" && break
            echo "waiting for proxy..."; sleep 1
          done
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Each step runs only if the previous one succeeded
      - run: node cli/index.ts scrapShowtimes ${{ inputs.days || 90 }}
      - run: node cli/index.ts scrapPosters
        env:
          IMAGEKIT_API_KEY: ${{ secrets.IMAGEKIT_API_KEY }}
      - run: node cli/index.ts savePosterBlurHashes
      # scrapTicketing (showtime tags and prices) is disabled

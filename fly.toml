# https://fly.io/docs/reference/configuration/
app = "cinecal"
primary_region = "cdg"

[env]
  ENV = "production"
  PORT = "8080"
  TZ = "Europe/Paris"
  PUBLIC_URL = "https://cinecal.fly.dev"
  SHOULD_REFRESH_BROWSER_IF_VERSION_MISMATCH = "true"

# Migrations run in the deploy workflow before `fly deploy` (.github/workflows/deploy.yml)

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "5s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "2s"
